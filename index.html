<html lang="hu"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Nagyerdei Víztorony</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#1a1a2e;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
  touch-action:none;
}
#wrap{
  position:relative;
  width:100%;
  max-width:680px;
  display:flex;
  flex-direction:column;
  align-items:center;
}
#cv{
  display:block;
  width:100%;
  /* height is set by JS to maintain 16:9 */
  image-rendering:pixelated;
  border-radius:6px;
  border:3px solid #333;
  touch-action:none;
}
/* Mobile D-pad */
#dpad{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  margin-top:10px;
  width:100%;
  max-width:680px;
  padding:0 12px;
}
.dpad-left{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.dpad-right{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  margin-left:auto;
}
.btn{
  background:rgba(80,80,160,0.7);
  border:2px solid rgba(120,120,220,0.8);
  border-radius:12px;
  color:#ddf;
  font-size:22px;
  font-family:monospace;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
  /* Size scales with viewport */
  width:clamp(56px,13vw,72px);
  height:clamp(56px,13vw,72px);
  transition:background 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.btn:active,.btn.pressed{
  background:rgba(120,120,220,0.9);
  transform:scale(0.94);
}
.btn-jump{
  width:clamp(70px,16vw,88px);
  height:clamp(70px,16vw,88px);
  font-size:28px;
  border-radius:50%;
  background:rgba(100,60,160,0.75);
  border-color:rgba(160,100,240,0.9);
}
#note{
  text-align:center;
  font-size:10px;
  color:#555;
  margin-top:5px;
  font-family:monospace;
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="680" height="360"></canvas>
  <div id="dpad">
    <div class="dpad-left">
      <div style="display:flex;gap:6px;">
        <button class="btn" id="bL">◀</button>
        <button class="btn" id="bR">▶</button>
      </div>
    </div>
    <div class="dpad-right">
      <button class="btn btn-jump" id="bJ">▲</button>
    </div>
  </div>
  <div id="note">PC: ← → mozgas | ↑ / SPACE ugras</div>
</div>

function gi(k){return(imgs[k]&&imgs[k].complete&&imgs[k].naturalWidth>0)?imgs[k]:null;}

function drawSky(){ctx.fillStyle='#79a3cd';ctx.fillRect(0,0,W,H);}

function drawClouds(){
  var ci=gi('cloud');if(!ci)return;
  for(var i=0;i<clouds.length;i++){
    var c=clouds[i],sx=c.wx-cam*CLOUD_P;
    if(sx>W+c.w||sx+c.w<0)continue;
    ctx.drawImage(ci,Math.round(sx),c.y,c.w,c.h);
  }
}

function drawTower(){
  var ti=gi('tower');if(!ti)return;
  var sx=Math.round(30-cam*0.08);
  if(sx<-130||sx>W)return;
  ctx.drawImage(ti,sx,GY-265,112,265);
}

function drawStadion(){
  var si=gi('stadion');if(!si)return;
  var sx=Math.round(580-cam*0.25);
  if(sx>W+10||sx+374<-10)return;
  ctx.drawImage(si,sx,GY-130,374,130);
}

function drawTrees(){
  var ti=gi('tree');if(!ti)return;
  for(var i=0;i<trees.length;i++){
    var t=trees[i],sx=Math.round(t.wx-cam*t.p);
    if(sx<-140||sx>W+140)continue;
    var tw=Math.round(109*t.s),th=Math.round(170*t.s);
    ctx.drawImage(ti,sx-Math.round(tw/2),GY-th,tw,th);
  }
}

function drawBushes(){
  var bi=gi('bush');if(!bi)return;
  for(var i=0;i<bushes.length;i++){
    var b=bushes[i],sx=Math.round(b.wx-cam*b.p);
    if(sx<-80||sx>W+80)continue;
    ctx.drawImage(bi,sx-35,GY-50,70,52);
  }
}

function drawGround(){
  var g=gi('ground');
  if(g){var gw=680,t0=Math.floor(cam/gw);for(var t=t0;t<=t0+2;t++)ctx.drawImage(g,t*gw-cam,GY,gw,GROUND_H);}
  else{ctx.fillStyle='#7ab228';ctx.fillRect(0,GY,W,20);ctx.fillStyle='#7A4E1C';ctx.fillRect(0,GY+20,W,60);}
}

function drawPlatforms(){
  var hi=gi('highland');
  for(var i=0;i<plats.length;i++){
    var p=plats[i],sx=Math.round(p.x-cam);
    if(sx>W+10||sx+PW<-10)continue;
    if(hi)ctx.drawImage(hi,sx,p.y,PW,PH);
    else{ctx.fillStyle='#7ab228';ctx.fillRect(sx,p.y,PW,12);ctx.fillStyle='#7A4E1C';ctx.fillRect(sx,p.y+12,PW,PH-12);}
  }
}

function drawHUD(){
  var li=gi('life');
  if(li)ctx.drawImage(li,W-132,10,122,46);
}

function getSprite(){
  if(!pg)return gi('jump');
  if(Math.abs(pvx)>0.4)return(Math.floor(animT/7)%2===0)?gi('walk1'):gi('walk2');
  return gi('side');
}

function drawChar(){
  var sp=getSprite();if(!sp)return;
  var CH=68,CW=Math.round(sp.naturalWidth*(CH/sp.naturalHeight));
  var cx=Math.round(px-cam),cy=Math.round(py);
  ctx.save();
  if(pf<0){ctx.translate(cx+CW,0);ctx.scale(-1,1);ctx.drawImage(sp,0,cy,CW,CH);}
  else ctx.drawImage(sp,cx,cy,CW,CH);
  ctx.restore();
}

function update(){
  animT++;
  if(K.l){pvx=-3.5;pf=-1;}
  else if(K.r){pvx=3.5;pf=1;}
  else{pvx*=0.75;if(Math.abs(pvx)<0.1)pvx=0;}
  if(K.u&&pg&&!pjump){pvy=-13.5;pg=false;pjump=true;}
  if(!K.u)pjump=false;
  pvy+=0.56;if(pvy>15)pvy=15;
  px+=pvx;py+=pvy;
  if(px<0)px=0;if(px>WORLD-60)px=WORLD-60;
  pg=false;
  if(py+68>=GY){py=GY-68;pvy=0;pg=true;}
  for(var i=0;i<plats.length;i++){
    var p=plats[i],prevB=py+68-pvy;
    if(px+38>p.x+2&&px+8<p.x+PW-2&&py+68>=p.y&&prevB<=p.y+10&&pvy>=0){
      py=p.y-68;pvy=0;pg=true;
    }
  }
  var tc=px-W/3;
  cam+=(tc-cam)*0.12;
  if(cam<0)cam=0;if(cam>WORLD-W)cam=WORLD-W;
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawSky();drawClouds();drawTower();drawStadion();
  drawTrees();drawBushes();drawGround();drawPlatforms();
  update();drawChar();drawHUD();
  requestAnimationFrame(loop);
}
loop();
})();
</script>
